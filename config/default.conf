# mp_board 默认配置
[common]
log_dir   = /tmp/mp_board/logs
log_level = 1          # 0 debug 1 info 2 warn 3 error

[bus]
pub_port = 27788       # 订阅端连这个端口
sub_port = 27789       # 发布端连这个端口

[serial]
port = /dev/ttyAS5
baud = 115200
sim  = 1               # 1 使用模拟数据，无硬件也能跑

[network]
host = 127.0.0.1
port = 1883
sn   = MPSN0001

[mpm]
procs = zmq_hub,carrier,network,tasks,monitor
